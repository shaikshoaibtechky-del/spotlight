let slI=0,slP=false;
const slides=()=>(D.biz.hero?[D.biz.hero]:[]).concat(PHU());
function slideHero(){
 const S=slides();
 return `<div class='hero2 sl'>${S.map((u,i)=>`<div class='sli${i===slI?' on':''}'><div class='bgb' style='background-image:url(${u})'></div><img src='${u}' alt='The Spotlight theatre photo ${i+1}'></div>`).join('')}<button class='sa l' aria-label='Previous photo' onclick='slGo(slI-1)'>&#8249;</button><button class='sa r' aria-label='Next photo' onclick='slGo(slI+1)'>&#8250;</button><div class='hc'><div class='eyebrow'>The Spotlight Private Theatre</div><h1>Make it special.<br>Make it unforgettable!</h1><p>Private theatre experiences for your special moments</p><div class='row'><button class='gb' onclick="bl('hero.book')">${BT('hero.book')}</button><button class='ob' onclick="bl('hero.explore')">${BT('hero.explore')}</button></div><div class='dots'>${S.map((_,i)=>`<button class='dot${i===slI?' on':''}' aria-label='Photo ${i+1}' onclick='slGo(${i})'></button>`).join('')}</div></div></div>`;
}
function slGo(n){const S=slides();slI=(n+S.length)%S.length;document.querySelectorAll('.sli').forEach((e,i)=>e.classList.toggle('on',i===slI));document.querySelectorAll('.dot').forEach((e,i)=>e.classList.toggle('on',i===slI))}
setInterval(()=>{if(document.querySelector('.sl'))slGo(slI+1)},4000);
function galHtml(){return `<div class='wide' id='gallery'><div class='eyebrow'>Gallery</div><h2 class='h2'>Moments from the theatre.</h2><div class='gal'>${PHU().map((u,i)=>`<img src='${u}' alt='Theatre and celebration photo ${i+1}' loading='lazy' onclick='slGo(${i+(D.biz.hero?1:0)});scrollTo(0,0)'>`).join('')}</div><div class='vid-gallery'><div class='eyebrow'>✦ The Spotlight Reels ✦</div><h2 class='h2'>Watch the experience.</h2><div class='vid-grid'>${vidHtml()}</div></div></div>`}
function setSt(id,s){const b=D.bk.find(x=>x.id===id);b.st=s;if(s==="Cancelled"||s==="Rejected")b.pay="Refund due";save();draw()}

// Start the reel when it scrolls into view. Try sound first; browsers may block
// audible autoplay unless the visitor has interacted with the page, so fall back to muted.
function setupSpotlightReels(){
  const section=document.querySelector('.vid-gallery');
  if(!section||section.dataset.reelSetup==='1')return;
  section.dataset.reelSetup='1';
